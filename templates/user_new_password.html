<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='user_new_password.css') }}">

</head>
<body>

<div class="container">
<h2>Reset Password</h2>

<form id="resetForm">
<input type="password" id="new_password" placeholder="New Password" required>
<input type="password" id="confirm_password" placeholder="Confirm Password" required>

<div id="message"></div>

<button type="submit">Update Password</button>
</form>

</div>

<script>
document.getElementById("resetForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const newPassword = document.getElementById("new_password").value;
  const confirmPassword = document.getElementById("confirm_password").value;
  const messageDiv = document.getElementById("message");

  messageDiv.innerHTML = "";

  if (newPassword.length < 6){
    messageDiv.innerHTML = "<p class='error'>Password must be at least 6 characters</p>";
    return;
  }

  if (newPassword !== confirmPassword){
    messageDiv.innerHTML = "<p class='error'>Passwords do not match</p>";
    return;
  }

  try {
    const response = await fetch("{{ url_for('user_new_password', data=data) }}", {
      method: "POST",  // make sure Flask route handles POST
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ new_password: newPassword })
    });

    const result = await response.json();

    if (response.ok) {
      messageDiv.innerHTML = "<p class='success'>Password updated successfully!</p>";

      // Redirect to user login after 2 seconds
      setTimeout(() => {
        window.location.href = "{{ url_for('user_login') }}";
      }, 2000);

    } else {
      messageDiv.innerHTML = `<p class='error'>${result.message || "Error updating password"}</p>`;
    }

  } catch(error) {
    messageDiv.innerHTML = "<p class='error'>Server error. Try again later.</p>";
  }

});
</script>

</body>
</html>
