<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - LAKSHMI MAKEOVERS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='user_signup.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<!-- Flash Messages (Centered) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="alert">
            <h3 style="color:red">{{ message }}</h3>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
<div class="signup-container text-center">
    <h2>Create Your Account</h2>
    <form method="POST" action="{{ url_for('user_signup') }}">
        <div class="mb-3 text-start">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" name="phoneno" placeholder="Enter your phone number" required>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label">Address</label>
            <textarea class="form-control" name="address" placeholder="Enter your address" rows="2" required></textarea>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Enter password" required>
        </div>
        <div class="mb-3 form-check text-start">
            <input type="checkbox" class="form-check-input" name="agree" id="agree" required>
            <label class="form-check-label" for="agree">I agree to the terms & conditions</label>
        </div>
        <button type="submit" class="btn btn-rosegold w-100">SignUp</button>
        <p class="mt-3">
            <a href="{{ url_for('welcome') }}">Back to Welcome Page</a>
        </p>
    </form>
</div>
<script>

document.addEventListener("DOMContentLoaded", () => {
    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {
        // Prevent form submission to check validation first
        let valid = true;
        let messages = [];

        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const phoneno = form.phoneno.value.trim();
        const address = form.address.value.trim();
        const password = form.password.value.trim();
        const agree = form.agree.checked;

        // Fullname validation
        if (name.length < 3) {
            valid = false;
            messages.push("Full Name must be at least 3 characters.");
        }

        // Email validation
        const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!emailPattern.test(email)) {
            valid = false;
            messages.push("Please enter a valid email address.");
        }

        // Phone number validation (10 digits)
        const phonePattern = /^\d{10}$/;
        if (!phonePattern.test(phoneno)) {
            valid = false;
            messages.push("Please enter a valid 10-digit phone number.");
        }

        // Address validation
        if (address.length < 5) {
            valid = false;
            messages.push("Please enter a valid address.");
        }

        // Password validation
        if (password.length < 6) {
            valid = false;
            messages.push("Password must be at least 6 characters.");
        }

        // Checkbox validation
        if (!agree) {
            valid = false;
            messages.push("You must agree to the terms & conditions.");
        }

        // If not valid, prevent submission and show alert
        if (!valid) {
            event.preventDefault();
            alert(messages.join("\n"));
        }
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
