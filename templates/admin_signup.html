<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign Up - LAKSHMI MAKEOVERS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin_signup.css') }}">

</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="alert">
        <h3 style="color:red">{{ message }}</h3>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<div class="signup-container text-center">
    <h2>Admin Registration</h2>

    <form method="POST" action="{{ url_for('admin_signup') }}">
        
        <div class="mb-3 text-start">
            <label class="form-label">Admin Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter admin name" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Admin Email</label>
            <input type="email" class="form-control" name="email" placeholder="Enter admin email" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Enter password" required>
        </div>

        <div class="mb-3 form-check text-start">
            <input type="checkbox" class="form-check-input" name="agree" id="agree" required>
            <label class="form-check-label" for="agree">I agree to the terms & conditions</label>
        </div>

        <button type="submit" class="btn btn-dark w-100">Sign Up</button>

        <p class="mt-3">
            <a href="{{ url_for('admin_login') }}">Already have an account? Login</a>
        </p>

    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {
        let valid = true;
        let messages = [];

        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const password = form.password.value.trim();
        const agree = form.agree.checked;

        // Name validation
        if (name.length < 3) {
            valid = false;
            messages.push("Admin name must be at least 3 characters.");
        }

        // Email validation
        const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!emailPattern.test(email)) {
            valid = false;
            messages.push("Please enter a valid email address.");
        }

        // Password validation
        if (password.length < 6) {
            valid = false;
            messages.push("Password must be at least 6 characters.");
        }

        // Checkbox validation
        if (!agree) {
            valid = false;
            messages.push("You must agree to the terms & conditions.");
        }

        if (!valid) {
            event.preventDefault();
            alert(messages.join("\n"));
        }
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
